name: CD Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Site
    runs-on: [self-hosted, landing]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Staging
    runs-on: [self-hosted, landing]
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to Nginx root
        run: |
          set -e
          rsync -avz --delete dist/ /var/www/wastenot-landing/
          echo "Deployed successfully to waste-not.bccdev.id"
