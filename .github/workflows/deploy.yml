name: Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 11023 proxy.bccdev.id >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VM
        run: |
          # Upload dist to VM
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 11023 -o StrictHostKeyChecking=no" \
            dist/ \
            dev@proxy.bccdev.id:/var/www/wastenot-landing/
          echo "Deployed successfully to oktaavsm.bccdev.id/wastenot-landing/"
